services:

  issuer:
    # from .. run
    # DOCKER_DEFAULT_PLATFORM=linux/amd64 docker build -f ./docker/Dockerfile --tag oid4vci .
    image: oid4vc
    build:
      dockerfile: docker/Dockerfile
      context: ..
      network: host
    ports:
      - "3000:3000"
      - "3004:3001"
      - "8082:8082"
    environment:
      RUST_LOG: warn
      OID4VCI_HOST: 0.0.0.0
      OID4VCI_PORT: 8082
      OID4VCI_ENDPOINT: ${OID4VCI_ENDPOINT}
      CLOUDFLARE_TUNNEL_URL: ${CLOUDFLARE_TUNNEL_URL}
      # Optional: Set if public endpoint differs from internal endpoint
      OID4VCI_PUBLIC_ENDPOINT: ${OID4VCI_PUBLIC_ENDPOINT:-}
    entrypoint: aca-py
    command: >
      start
        --inbound-transport http 0.0.0.0 3000
        --outbound-transport http
        --endpoint http://issuer:3000
        --admin 0.0.0.0 3001
        --admin-insecure-mode
        --webhook-url http://demo-app:3000/webhook
        --webhook-url http://issuer:3000/webhook
        --webhook-url http://webhook-listener:8080
        --no-ledger
        --wallet-type askar
        --emit-new-didcomm-prefix
        --wallet-storage-type default
        --wallet-name issuer
        --wallet-key insecure
        --auto-provision
        --log-level info
        --debug-webhooks
        --plugin oid4vc
        --plugin sd_jwt_vc
        --plugin mso_mdoc
        --multitenant
        --multitenant-admin
        --jwt-secret insecure
        --multitenancy-config wallet_type=single-wallet-askar key_derivation_method=RAW
    healthcheck:
      test: curl -s -o /dev/null -w '%{http_code}' "http://localhost:3001/status/live" | grep "200" > /dev/null
      start_period: 30s
      interval: 7s
      timeout: 5s
      retries: 5
    depends_on:
      webhook-listener:
        condition: service_started

  webhook-listener:
    image: mendhak/http-https-echo:18
    environment:
      - HTTP_PORT=8080

  demo-app:
    build:
      context: ./frontend
      network: host
    ports:
      - "3005:3000"
    volumes:
      - ./frontend/index.js:/app/index.js:z
      - ./frontend/templates:/app/templates:z
    environment:
      - NODE_ENV=development # Set NODE_ENV to 'development'
      - WDS_SOCKET_PORT=0
      - API_BASE_URL=http://issuer:3001
      - FORCE_COLOR=3
    depends_on:
      issuer:
        condition: service_healthy

  demo-app-nextjs:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile.optimized
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=production
      - CLOUDFLARE_TUNNEL_URL=http://issuer:3001
      - OID4VCI_ENDPOINT=http://issuer:8082
      - OID4VCI_PUBLIC_ENDPOINT=${OID4VCI_PUBLIC_ENDPOINT}
    depends_on:
      issuer:
        condition: service_healthy

  # issuer-app:
  #   build:
  #     context: ./issuer-app
  #   ports:
  #     - "3003:3000"
  #   volumes:
  #     - ./issuer-app/index.js:/app/index.js:z
